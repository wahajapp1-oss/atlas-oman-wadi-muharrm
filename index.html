<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><title>أطلس عمان التفاعلي — مدرسة وادي محرم (١-١٢)</title>
<style>
:root{--bg:#f4efe4;--card:#fffdf8;--tx:#2b2218;--mu:#75665a;--bd:#e3d8c3;--ac:#8f2d2d;--sea1:#d9edf2;--sea2:#a9d3e0;--land:#ecdcb2;--ln:#b4914d;--ok:#2e7d4f;--no:#b3261e;--m:#8a5a2b;--f:#1f7a8c;--s:#2e8b57;--b:#2563a8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15110e;--card:#221c16;--tx:#f3eadb;--mu:#b9ab97;--bd:#3a3026;--ac:#e8736d;--sea1:#14303a;--sea2:#0f222b;--land:#4b3f28;--ln:#a8883f;--ok:#5cc88a;--no:#ff8a80;--m:#d9a066;--f:#5cc3d6;--s:#6fd49a;--b:#7fb2ee}}
:root[data-theme=dark]{--bg:#15110e;--card:#221c16;--tx:#f3eadb;--mu:#b9ab97;--bd:#3a3026;--ac:#e8736d;--sea1:#14303a;--sea2:#0f222b;--land:#4b3f28;--ln:#a8883f;--ok:#5cc88a;--no:#ff8a80;--m:#d9a066;--f:#5cc3d6;--s:#6fd49a;--b:#7fb2ee}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.7}
header{text-align:center;padding:14px 12px 2px}
h1{margin:0;font-size:1.35rem;color:var(--ac)}header p{margin:0;color:var(--mu);font-size:.85rem}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 8px}
.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 12px;border-radius:20px;font:inherit;font-size:.82rem;cursor:pointer}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{max-width:960px;margin:auto;display:grid;gap:12px;padding:0 10px 18px}
@media(min-width:780px){.wrap{grid-template-columns:1.1fr .9fr;align-items:start}}
.map{border-radius:16px;border:1px solid var(--bd);overflow:hidden;background:var(--sea1)}
svg{display:block;width:100%;aspect-ratio:540/610;touch-action:manipulation}
.pin{cursor:pointer}.pin .c{stroke:#fff;stroke-width:2.2}.pin .c2{fill:none;stroke-width:2;opacity:0}
.pin.sel .c2{opacity:.6;animation:p 1.4s infinite}@keyframes p{from{r:12}to{r:24;opacity:0}}
.pin text{pointer-events:none}.pe{font-size:12px}.pl{font-size:11px;font-weight:600;fill:var(--tx);paint-order:stroke;stroke:var(--land);stroke-width:3.5px}
.pin.bs .pl{stroke:var(--sea1)}
.cty{font-size:8px;fill:var(--mu)}.sea{font-size:12px;fill:var(--mu);font-style:italic;letter-spacing:1px}
.leg{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:.78rem;color:var(--mu);padding:7px;background:var(--card);border-top:1px solid var(--bd)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:4px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;min-height:180px}
.tag{display:inline-block;color:#fff;font-size:.74rem;padding:1px 10px;border-radius:12px}
.panel h2{margin:6px 0 0;font-size:1.2rem}.loc{color:var(--mu);font-size:.82rem}
.st{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.st span{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:2px 10px;font-size:.8rem}
.q{margin-top:10px;border-top:1px dashed var(--bd);padding-top:8px}.q b{display:block;margin-bottom:4px}
.opt{display:block;width:100%;text-align:right;margin:5px 0;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--no);color:#fff}
.sc{margin-top:10px;display:flex;justify-content:space-between;color:var(--mu);font-size:.82rem}
.bar{height:6px;background:var(--bd);border-radius:4px;margin-top:4px;overflow:hidden}.bar div{height:100%;background:var(--ok);width:0;transition:width .4s}
.hint{color:var(--mu);text-align:center;padding:36px 8px}
.note{font-size:.74rem;color:var(--mu);text-align:center;padding:0 12px 14px}
:root{--c:#8e5bb5}
.chips{overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;scrollbar-width:thin}.chips button{flex:none}
.gchips{flex-wrap:wrap;justify-content:center}
.li{display:flex;align-items:center;gap:9px;width:100%;text-align:right;padding:9px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.li b{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:.8rem;flex:none}.li small{color:var(--mu);margin-inline-start:auto}
.back{border:0;background:none;color:var(--ac);font:inherit;cursor:pointer;padding:0 0 6px}
.pin .nb{font-size:13px;font-weight:700;fill:#fff}

:root{--h:#c58b1a}
body{font-family:"Tajawal","Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;background:radial-gradient(circle at 20% 0,rgba(143,45,45,.08),transparent 40%),var(--bg)}
.hero{position:relative;overflow:hidden;text-align:center;color:#fff;padding:18px 14px 20px;margin:0 0 10px;background:linear-gradient(135deg,#7d1f2a 0%,#b3392f 45%,#1f7a8c 100%);border-radius:0 0 28px 28px;box-shadow:0 10px 30px rgba(125,31,42,.35)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.22),transparent 40%),repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px)}
.hero>*{position:relative}
.sch{display:inline-block;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.45);padding:5px 20px;border-radius:30px;font-weight:800;font-size:1.15rem;letter-spacing:.3px}
.hero h1{color:#fff;font-size:1.7rem;margin:10px 0 2px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.hero p{margin:0;opacity:.92;font-size:.9rem;color:#fff}
.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.hud span{background:rgba(0,0,0,.25);padding:4px 14px;border-radius:20px;font-size:.85rem}
.acts{display:flex;gap:8px;justify-content:center;margin-top:10px}
.acts button{border:0;background:#fff;color:#7d1f2a;font:inherit;font-weight:700;padding:7px 16px;border-radius:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .15s}
.acts button:active{transform:scale(.93)}
.chips button{transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.06)}.chips button:hover{transform:translateY(-1px)}
.chips button.on{background:linear-gradient(135deg,#8f2d2d,#c0392b);box-shadow:0 4px 12px rgba(143,45,45,.35)}
.map{box-shadow:0 12px 32px rgba(40,30,20,.18);border-radius:22px}
.panel{border-radius:22px;box-shadow:0 12px 32px rgba(40,30,20,.12);animation:in .35s}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.zone{cursor:pointer;transition:fill-opacity .25s}.map svg{direction:ltr}.zone:hover{fill-opacity:.55!important}
.gl{font-weight:800;fill:var(--tx);paint-order:stroke;stroke:var(--land);stroke-width:4px;pointer-events:none}
.pin{transition:opacity .2s}.pin .c{filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}.pin:hover .c{r:13}
.gh{background:linear-gradient(135deg,var(--gc),color-mix(in srgb,var(--gc) 55%,#000));color:#fff;border-radius:16px;padding:12px 14px}
.gh h2{margin:0;font-size:1.25rem;color:#fff}.gh p{margin:4px 0 8px;font-size:.88rem;opacity:.95}
.gs{display:flex;gap:6px;flex-wrap:wrap}.gs span{background:rgba(255,255,255,.22);border-radius:12px;padding:1px 10px;font-size:.78rem}
.hl{font-weight:800;margin:14px 0 4px;font-size:.95rem}
.hs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.hc{flex:none;width:128px;scroll-snap-align:start;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:1px;transition:transform .2s}
.hc:hover{transform:translateY(-3px)}.hc i{display:block;width:100%;text-align:center;font-style:normal;font-size:1.5rem}.hc b{font-size:.84rem}.hc small{color:var(--mu);font-size:.73rem;line-height:1.4}
.hint .big{font-size:2.6rem}
.li{transition:transform .15s,border-color .2s}.li:hover{transform:translateX(-3px);border-color:var(--ac)}
.opt{transition:transform .12s}.opt:active{transform:scale(.98)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:#2b2218;color:#fff;padding:10px 20px;border-radius:26px;opacity:0;transition:.35s;z-index:50;font-weight:700;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.info{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:10px 0}.ih{font-weight:800;margin-bottom:2px}.info ul{margin:0;padding:0;list-style:none}.info li{padding:6px 0;border-top:1px dashed var(--bd);font-size:.9rem;line-height:1.8}.info li:first-child{border-top:0}.info li:before{content:"✦ ";color:var(--ac)}
.gq{display:block;width:100%;margin:12px 0 4px;padding:12px;border:0;border-radius:14px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#8f2d2d,#c0392b);cursor:pointer;box-shadow:0 6px 16px rgba(143,45,45,.35);transition:transform .15s}.gq:active{transform:scale(.97)}
.sch{display:inline-flex;align-items:center;gap:10px;padding:6px 22px 6px 18px}.emb{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.emb2{display:block;margin:0 auto 6px;height:118px;width:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.acts{flex-wrap:wrap}.acts select{max-width:150px;border:0;border-radius:24px;padding:7px 10px;font:inherit;font-size:.82rem;background:rgba(255,255,255,.92);color:#7d1f2a}
.sch{padding:6px 24px}
.spk{display:inline-flex;align-items:center;gap:6px;margin:8px 0 2px;border:0;background:linear-gradient(135deg,#1f7a8c,#2e8b57);color:#fff;font:inherit;font-weight:700;padding:8px 16px;border-radius:22px;cursor:pointer;box-shadow:0 4px 12px rgba(31,122,140,.35)}
.spk.on,.acts button.on{background:#c0392b;color:#fff;animation:pl 1.2s infinite}@keyframes pl{50%{box-shadow:0 0 0 7px rgba(192,57,43,.2)}}
.rd{background:rgba(255,196,50,.3);border-radius:8px;transition:background .3s}
</style></head><body>

var FACTS={
'فلج وعين الحمّام':['تقع عين الحمّام في ولاية بوشر بمحافظة مسقط، وتبلغ حرارة مياهها نحو 66°م، فهي أسخن عين ماء في عمان.','يتدفق منها نحو 14 لتراً في الثانية، وتبلغ موصليتها الكهربائية 1420 ميكروسيمنز لكل سم.','الفلج العيني يستمد مياهه من عين، وعدد هذه الأفلاج محدود، ومنها فلج الحمّام.','تُسمّى العيون التي تزيد حرارتها على 34°م عيوناً حارة، وتزداد حرارة العين بزيادة عمق منبعها بدرجة مئوية لكل 25 إلى 40 م تحت سطح الأرض.'],
'كهف مجلس الجن':['يُعدّ ثالث أكبر كهف جوفي في العالم، وقدّر بعض الخبراء سعته بما يعادل 12 طائرة بوينج 747 أو نحو 1600 حافلة سياحية.','طوله 310 م وعرضه 225 م، والمسافة من الأرض إلى سقفه الذي على هيئة قبة 120 م، ولا يدل عليه من الخارج سوى ثلاث فتحات.','اكتُشف أثناء برنامج للبحث عن مياه جوفية عميقة، وكان أول من هبط فيه عام 1983م من الفتحة التي عمقها 120 م، وهي أقصر الفتحات الثلاث.','هبطت زوجة المكتشف عام 1984م من أعمق فتحة (158 م) فسُمّيت باسمها، ثم هبط الثالث من الفتحة الأخيرة عام 1985م.','قدّر الجيولوجيون عمره بخمسين مليون سنة، ولا يمكن النزول إليه إلا بالحبال، ولا يناسب المبتدئين لأنه يتطلب تدريباً ومهارة عالية.','يتطلب الوصول إلى قمته مشياً نحو 1300 م في دروب وعرة قرابة خمس ساعات، أو بالطائرة العمودية.'],
'جبل داود':['يمتد في عرض بحر عمان قرب ولاية قريات، فيشكّل مرسى طبيعياً للسفن والقوارب.','قريات إحدى ولايات محافظة مسقط الست، وفيها كهف مجلس الجن.','تتصل محافظة مسقط من الشرق بجبال الحجر الشرقي وبمحافظة شمال الشرقية.','يطل على بحر عمان الذي تتلقى منه سواحل مسقط مناخاً ورطوبة عالية في الصيف.'],
'جزر الديمانيات':['أرخبيل يضم تسع جزر، منها الخرابة والحايوت والجبل الصغير والمملحة.','تقصد الطيور البحرية الجزر لتعشش وتتوالد بين صخورها، خاصة في الصيف.','تتكاثر السلاحف على شواطئ الجزر، وتحيط بها شعاب مرجانية.','تقع في بحر عمان الذي يتميز بتنوع الأسماك والأعشاب البحرية وبوجود الدلافين.'],
'جبل شمس':['قمته نحو 3000 م فوق سطح البحر، وهي أعلى قمة في سلطنة عمان.','يقع ضمن جبال الحجر الغربي في محافظة الداخلية قرب ولاية الحمراء.','يطل على وادي غول، وهو جرف عميق يبلغ نحو ألف متر، ولذلك يُلقّب بـ«الأخدود العظيم».','ترتفع جبال الحجر في شمال عمان على شكل هلال يمتد من مسندم إلى رأس الحد.'],
'الجبل الأخضر':['هضبة جبلية ترتفع في جبال الحجر الغربي أكثر من 2000 م عن سطح البحر.','تشتهر بمدرجاتها الزراعية التي تحفظ التربة والماء على السفوح.','يُزرع فيها الرمان والورد الجبلي الذي يُستخلص منه ماء الورد، ويُقطف في الربيع.','تنحدر من سفوحه الهضبة الكبرى لمحافظة الداخلية جنوباً نحو الصحراء.'],
'أنواع الأفلاج':['كلمة «فلج» من الفعل فلج بمعنى فلق وشقّ، وهو قناة مائية مصدرها فجوة في مكان مرتفع في طبقة صخرية.','تمتد القناة أميالاً حتى الأرض الزراعية: سطحية إن كانت الأرض مستوية، ومحفورة إذا صادفت أرضاً مرتفعة، وبجسر إذا مرّت بأرض منخفضة.','الفلج الداؤدي قناة جوفية طويلة بعمق عشرات الأمتار تجري طوال العام، ونسبته نحو 45% من أفلاج عمان.','الفلج الغيلي يستمد مياهه من المياه السطحية بعمق 3 إلى 4 م، يزداد منسوبه بعد المطر وقد يجف عند انقطاعه، ونسبته 55%.','تُوزَّع المياه على الحيازات بنظام زمني دقيق، ويُخصَّص جزء من المحاصيل وقفاً للفلج للصرف على صيانته باتفاق الأهالي وإشراف وكيل الفلج.','تتأثر الأفلاج بنقص الأمطار، وتوضع خطط سنوية لصيانة المتضرر منها وحماية مصادرها من التلوث والاستنزاف.'],
'أفلاج منح وسمائل':['وُجدت الأفلاج في عمان منذ ما قبل الإسلام، وهي نظام هندسي للري توارثته الأجيال مئات السنين.','بُني بعض أفلاج ولايتي منح وسمائل منذ أكثر من 1500 عام، بينما بُنيت أفلاج في الشرقية بداية القرن العشرين.','حفر العمانيون القنوات على أعماق تبلغ عشرات الأمتار دون آلات ميكانيكية، فعُدّ ذلك إعجازاً هندسياً.','تشتهر سمائل بفقهائها وعلمائها وبواديها وواحاتها الخضراء وكثرة النخيل وصناعة النسيج والجلود.'],
'كهف الهوتة':['ثاني أكبر كهف في عمان بعد مجلس الجن، وسُمّي بالهوتة نسبة إلى القرية القريبة منه، ويبعد نحو 10 كم عن مركز ولاية الحمراء.','أبرز ما فيه الصواعد والهوابط، وبعض الأعمدة يصل قطرها نحو 5 م، وألوان الصخور المتدلية تدل على أجيال وظروف مناخية مختلفة.','في بحيرته ماء طوال العام تعيش فيه أسماك عمياء شاحبة اللون، لها شعيرات طويلة تلتمس بها الطعام.','يتجدد هواؤه لأن الهواء الخارجي يمر من الكهف إلى كهف الفلاح عبر البحيرات، فيبقى جيداً ومنعشاً.','يركب الزائر قطاراً من ثلاث مقطورات طولها 22 م تتسع لـ40 زائراً، ينقلهم 675 م عبر نفق في الجبل طوله 153 م، ثم يمشون 850 م مع مرشد، وتستغرق الزيارة نحو ساعة.'],
'أفلاج صحار':['تتصدر صحار ولايات السلطنة بنحو 70 فلجاً، من أكثر من 4000 فلج في عمان.','صحار مركز محافظة شمال الباطنة، وتبعد عن مسقط نحو 230 كم.','يبلغ عرض السهل الساحلي في المحافظة نحو 25 كم بين جبال الحجر الغربي وبحر عمان.','تشتهر بصناعة الخناجر والسيوف والسفن والفخار والجلد والحلوى العمانية.','تنفرد بأشجار نادرة: الماسوة في ولاية لوى والديباج في ولاية السويق.'],
'بحر عمان':['يمتد من مضيق هرمز حتى رأس الحد رابطاً المحيط الهندي بالخليج العربي.','يبلغ عمقه عند مسقط أكثر من 500 م، ومتوسط حرارة مائه 28°م، وتصل الرطوبة النسبية إلى 90%.','معدل الرؤية تحت الماء بين 12 و15 م، لذلك يُعدّ مناخه جيداً للغوص، وأفضل شهوره مايو ويونيو، ويتعذر الغوص شتاءً لارتفاع الموج.','يتعرض صيفاً لظاهرة المد الأحمر، فتتكاثر العوالق النباتية بسبب التيارات الباردة القادمة من بحر العرب، فيقل الأكسجين وتنفق الأسماك.','سُمّي «خليج عمان» ثم غُيّر اسمه إلى بحر عمان عام 2009م.'],
'عين الكسفة':['حرارتها ثابتة نحو 45°م، وتخرج مياهها في عدة جداول لسقاية البساتين.','تُعرف بأنها علاج طبيعي للروماتيزم وللأمراض الجلدية لطبيعتها الكبريتية، وتبعد كيلومتراً من وسط ولاية الرستاق.','يصل معدل تدفقها إلى نحو 81 لتراً في الثانية.','يبلغ متوسط ما يتدفق من العيون الحارة في عمان نحو 8 ملايين جالون يومياً، ومن العيون الباردة نحو 15 مليون جالون.'],
'عين الثوارة':['تنبع من جبل صلد في ولاية نخل، وتنساب في الوادي نحو 300 م ثم تتفرع إلى فلج «كبة» وفلج «الصاروج».','تعتمد نخل عليها وعلى روافدها في ري نحو 90% من مزروعاتها.','مياهها صحية دافئة تصل حرارتها إلى نحو 37°م، وتدفقها نحو 53 لتراً في الثانية.','مثال على العيون التي تغذي الأفلاج في عمان.'],
'كهف مقل':['يقع في قرية مقل بولاية بني خالد، وقد اتخذت الولاية واحاتها المائية شعاراً لها.','تتدفق المياه العذبة بين الصخور التي نحتتها الطبيعة، وتمتد الواحات أكثر من 200 م طولاً ونحو 20 م عرضاً.','عمقها أكثر من ستة أمتار فهي مناسبة للسباحة.','ينساب الماء ليصنع منه العماني القديم أفلاجاً تمتد كيلومترات لتروي المزارع.','حولها أشجار خضراء واستراحات ومسجد لمرتادي المكان.'],
'رأس الحد':['من أكبر الرؤوس الرملية المطلة على بحر عمان، وهو لسان بحري مثلث قاعدته في البر.','يمتد أحد أضلاعه أكثر من 3 كم موازياً لبحر عمان والضلع الآخر موازياً لبحر العرب.','يتكوّن بالتقاء الرياح الجنوبية الغربية السائدة في بحر العرب بالرياح الشمالية الشرقية السائدة في بحر عمان، وساهمت الأمواج في تكوينه.','يقع في محافظة جنوب الشرقية، وهي أول بقعة في الوطن العربي تشرق عليها الشمس.'],
'مسندم':['ترتفع جبالها الوعرة نحو 1800 م، ويفصلها عن بقية السلطنة جزء من أراضي الإمارات.','يطل رأس مسندم على مضيق هرمز الذي يعبره نحو 90% من بترول الخليج، والجزء الصالح للملاحة منه يقع في مياه السلطنة.','ساحلها صخري شديد الانحدار فيه خلجان وأودية غارقة (فيوردات)، ومن خلجانها خليج خصب وخليج كمزار وخليج شيصة.','تضم أربع ولايات: خصب ودبا وبخا ومدحاء، وتبعد خصب عن مسقط نحو 550 كم.'],
'بحر العرب':['امتداد للمحيط الهندي بين سواحل شبه الجزيرة العربية وشبه الجزيرة الهندية، أقصى عرضه 2400 كم وأقصى عمقه 4.6 كم.','له ذراعان ممتدان هما بحر عمان وخليج عدن، وتطل عليه عمان والهند وإيران وباكستان واليمن والصومال.','تمتد شواطئ عمان عليه 560 كم، وفيها سهل ساحلي بعرض 8 كم في ظفار.','في الصيف يزداد بخار الماء المتصاعد منه فيتشكل سحب على ساحل ظفار وجبالها وتتساقط الرذاذ، وهو موسم الخريف.','يشتهر بالصفيح (أذن البحر) والشارخة، ويبدأ موسم جمع الصفيح في أكتوبر.','فيه جزيرة مصيرة أكبر الجزر العمانية، وجزر الحلانيات، وجبل حمر الذي يقع في عرض البحر قرب ولاية الدقم.'],
'عين رزات':['من أكثر عيون ظفار غزارة ومنسوبها مرتفع طوال العام، وتوفر نحو 5.52 مليون م³ من الماء سنوياً.','تبعد نحو 9 كم عن صلالة، وتقع في الجزء الشمالي من منطقة المعمورة.','يصل معدل تدفقها إلى نحو 180 لتراً في الثانية، وحرارتها نحو 31°م، فهي عين باردة لأن حرارتها قريبة من حرارة الهواء.','فيها كهوف جُهّزت مداخلها بممرات، وحديقة واسعة بأشجار ظليلة تناسب العائلات.'],
'عين جرزيز':['أكثر العيون جذباً للسياح طوال العام، وتبعد نحو 7 كم عن مركز صلالة، ويُوصل إليها عبر سهل أتين.','فيها حوض مائي كبير على شكل بركة سباحة عميقة، وتطل عليها قمم جبلية خضراء.','وادي جرزيز ذو تكوينات صخرية متنوعة، وتدفق العين نحو 35 لتراً في الثانية وحرارتها نحو 29°م.','في ظفار نحو 360 عيناً، معظمها دائم الجريان، ويغذيها موسم الخريف.'],
'عين دربات':['من أهم عيون ظفار، وتبعد نحو 42 كم عن صلالة شمال شرق مدينة طاقة.','منسوبها عالٍ فتكوّن شلالات دربات الشهيرة، وتصل جداولها إلى عدة كيلومترات.','يتصل واديها بمنطقة سمهرم الأثرية، ويمتد البساط الأخضر في أرجائه.','تضيف الأشجار المتدلية على ضفاف الجداول لوحة فنية، وتتوفر فيها خدمات سياحية وترفيهية.'],
'كهوف وادي دربات':['ستة كهوف في ولاية طاقة، تكوّنت بإذابة مياه الشلالات للحجر الجيري، فهي من كهوف الإذابة الكاريستية.','الكهف الأول قوس طبيعي عمقه نحو 10 م، ويرتفع نحو 20 م عن الوادي، وفيه هوابط جزرية الشكل.','على جدران الكهف الثاني نقوش قديمة لجمال وماعز وحيوانات برية تدل على استخدام الإنسان له.','الكهف السادس أكبرها: عرضه نحو 80 م وارتفاعه نحو 25 م.','تأوي الخفافيش والزواحف والعناكب وبعض الطيور، وبعض هوابطها يبلغ طولها مترين.'],
'عين حشير':['من أجمل عيون ظفار وتقع في ولاية مرباط، وتبعد 54 كم شرق صلالة، وسُمّيت نسبة إلى الجبال التي تقع فيها.','تضم أشجار التبلدي (الباوباب) العملاقة النادرة واسمها العلمي Adansonia digitata، ويسميها أهل المنطقة «الكجي».','هي من أندر أنواع الأشجار في العالم، وعددها هنا قد لا يتجاوز نحو 30 شجرة فقط.','تنمو فوق سفح عقبة حشير في منطقة محصورة بين العقبة ووادي حنة.'],
'جبل سمحان':['من جبال ظفار التي تنبع من سفوحها معظم عيون المحافظة.','تقع قربه حفرة طوي أعتير، من أكبر حفر الإذابة في العالم.','تحمي محمية جبل سمحان الطبيعية النمر العربي، وهو من أندر الحيوانات المهددة بالانقراض.','في الخريف يتشكل سحب على جبال ظفار ويتساقط الرذاذ فتخضر السفوح.'],
'كهف صحور':['يقع في وادي نحيز على بعد 12.5 كم شمال مدينة صلالة، في صخور جيرية من العصر الثلاثي المبكر.','مدخله كبير يزيّنه قوس فيه هوابط وصواعد يبلغ ارتفاعها مترين، تقف كحارس للردهة.','للوصول إلى غرفته الرئيسية يجب عبور ممر ضيق في الجهة الشمالية من المدخل.','علامته المميزة حوض جاف طوله 1.8 م وعرضه 1.5 م عليه آثار مياه شلالات متحجرة.','تسكنه الخفافيش والحشرات، وتتدلى فيه قطرات ماء من هوابط لا تزال في مراحل تكوّنها.'],
'طوي أعتير (بئر الطيور)':['حفرة إذابة عمقها نحو 211 م وقطرها بين 13 و150 م وحجمها نحو 975 ألف م³، من أكبر حفر الإذابة في العالم.','تقع في ولاية مرباط ضمن تكوين أم الرضومة الأيوسيني.','تكوّنت بعد انهيار أسقف كهوف باطنية بفعل الصدوع وإذابة المياه للطبقات اللينة.','فيها هوابط وصواعد وشلالات وبحيرات عميقة تعيش فيها أسماك عمياء نادرة.','على جدران كهوفها نقوش للإبل، وكانت لسنوات مصدراً رئيساً للماء لاعتقاد الناس بجودته.','سُمّيت بئر الطيور لكثرة الطيور فيها، وفيها أيضاً ثعالب وزواحف وخفافيش.'],
'ميناء سمهرم':['ميناء تاريخي اشتهر بتصدير اللبان عند خور روري، وتقع المدينة على ساحل صلالة.','خور روري من أكبر الأخوار على ساحل بحر العرب، وسُجّل فيه أكثر من مائة نوع من الطيور.','سُجّل فيه أيضاً نحو 20 نوعاً من النباتات و11 نوعاً من الأسماك، وتنتشر فيه أشجار القرم.','كانت ظفار بوابة عمانية ضخمة على المحيط الهندي ومعبراً لطريق القوافل القديم.'],
'مدينة البليد':['من آثار ظفار التاريخية في صلالة، إلى جانب ميناء سمهرم وآثار وبار.','في ظفار أيضاً مجموعات أثرية في المغسيل وقلعة حمران بصلالة، وفي حاسك وهانون والمحلة بسدح.','شكّلت ظفار همزة وصل بين عمان وشرق أفريقيا.','تتميز بالسياحة الدينية والتاريخية، ففيها الأحقاف وقبور الأنبياء هود وأيوب وصالح عليهم السلام.'],
'قلعة نزوى':['كانت نزوى عاصمة عمان في عصور الإسلام الأولى، واشتهرت بالعلماء والفقهاء والمؤرخين، فلُقّبت بـ«بيضة الإسلام».','لا تزال قلعتها التاريخية شامخة حتى اليوم، وتحيط بها حصون وأبراج ومساجد أثرية قديمة.','نزوى مركز محافظة الداخلية وتبعد عن مسقط نحو 164 كم.','الداخلية من أهم المناطق الزراعية في السلطنة وعمقها الاستراتيجي.'],
'قلعة بهلاء':['بهلاء من أقدم مناطق عمان، وكانت عاصمة لها في بعض فترات التاريخ القديم.','قلعتها مدرجة ضمن قائمة التراث العالمي لمنظمة اليونسكو.','تشتهر بسورها التاريخي وبحصن جبرين الشهير.','هي إحدى ولايات الداخلية الثماني: نزوى وبهلاء ومنح والحمراء وأدم وإزكي وسمائل وبدبد.'],
'حصن جبرين':['حصن شهير في ولاية بهلاء.','يقع قرب قلعة بهلاء المدرجة في التراث العالمي وسورها التاريخي.','تنتشر في محافظة الداخلية حصون وأبراج ومساجد أثرية قديمة.','الداخلية عمق استراتيجي للسلطنة ومن أبرز مناطقها الزراعية.'],

'قلعة الرستاق':['الرستاق مركز محافظة جنوب الباطنة التي تضم ست ولايات.','من ولاياتها: الرستاق والعوابي ونخل ووادي المعاول وبركاء والمصنعة.','تشتهر المحافظة بحصن الحزم وقلعة الرستاق وبعيونها كالكسفة والثوارة.','تطل على بحر عمان وتمتد من خطمة الملاحة شمالاً إلى رأس الحمراء جنوباً.'],
'حصن الحزم':['من أشهر المعالم التاريخية والسياحية في محافظة جنوب الباطنة.','تشتهر ولاية بركاء بجمال سواحلها وبالطيور والسلاحف التي تعيش في جزرها.','في المحافظة عيون مثل عين الكسفة في الرستاق وعين الثوارة في نخل.'],
